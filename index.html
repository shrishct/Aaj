<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exact Swiss Ephemeris Vedic Engine</title>
    <!-- Official Swiss Ephemeris compiled for Browser -->
    <script src="https://cdn.jsdelivr.net/npm/swisseph-js@0.1.2/dist/swisseph.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 46, 0.85);
            --accent-gold: #fbbf24;
            --accent-blue: #60a5fa;
            --text-main: #f3f4f6;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 1.5rem 1rem; display: flex; justify-content: center; }
        .container { max-width: 950px; width: 100%; display: flex; flex-direction: column; gap: 1.25rem; }
        
        header { text-align: center; }
        header h1 { font-size: 1.8rem; color: var(--accent-gold); margin-bottom: 0.2rem; }
        header p { color: var(--text-muted); font-size: 0.85rem; }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 1rem; padding: 1.25rem; }
        .section-title { font-size: 0.85rem; font-weight: 700; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
        .form-group { margin-bottom: 0.85rem; }
        label { display: block; font-size: 0.8rem; color: #9ca3af; margin-bottom: 0.3rem; }
        input, select { width: 100%; padding: 0.65rem 0.8rem; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color); border-radius: 0.5rem; color: #fff; font-size: 0.9rem; }
        .row { display: flex; gap: 0.5rem; }
        button.btn-primary { width: 100%; padding: 0.75rem; background: linear-gradient(135deg, var(--accent-gold), #d97706); border: none; border-radius: 0.5rem; color: #000; font-weight: 700; cursor: pointer; font-size: 0.95rem; margin-top: 0.5rem; }

        .chart-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        @media (min-width: 650px) { .chart-grid { grid-template-columns: 1fr 1fr; } }
        
        .kundli-box {
            aspect-ratio: 1;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            border: 2px solid var(--accent-gold);
            position: relative;
            background: rgba(0,0,0,0.4);
            border-radius: 0.5rem;
        }
        .kundli-title { text-align: center; font-size: 0.9rem; font-weight: 700; color: var(--accent-gold); margin-bottom: 0.5rem; }
        .chart-svg { width: 100%; height: 100%; }

        .astro-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; }
        .astro-table th, .astro-table td { padding: 0.65rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        .astro-table th { background: rgba(0, 0, 0, 0.3); color: var(--accent-gold); font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Swiss Ephemeris Kundli Engine</h1>
        <p>100% AstroSage Compliant Sidereal Calculation</p>
    </header>

    <div class="card" id="formCard">
        <form id="horoscopeForm">
            <div class="section-title">Birth Details</div>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" value="Shrish Chandra" required>
            </div>

            <div class="row form-group">
                <div style="flex: 1;">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" required>
                </div>
                <div style="flex: 1;">
                    <label for="tob">Time of Birth (Local Time)</label>
                    <input type="time" id="tob" step="1" required>
                </div>
            </div>

            <div class="row form-group">
                <div style="flex: 1;">
                    <label for="tzHours">Timezone Offset (Hours)</label>
                    <input type="number" id="tzHours" value="5.5" step="0.1" placeholder="5.5 for IST" required>
                </div>
            </div>

            <div class="row form-group">
                <div>
                    <label for="bLat">Birth Lat (°N)</label>
                    <input type="number" id="bLat" value="26.85" step="any" required>
                </div>
                <div>
                    <label for="bLon">Birth Lon (°E)</label>
                    <input type="number" id="bLon" value="80.94" step="any" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">Generate Exact Kundli</button>
        </form>
    </div>

    <!-- Results Card -->
    <div class="card" id="resultsCard" style="display: none;">
        <div class="chart-grid">
            <div>
                <div class="kundli-title">D1 - Rashi Kundli</div>
                <div class="kundli-box" id="d1ChartBox"></div>
            </div>
            <div>
                <div class="kundli-title">D9 - Navamsha Kundli</div>
                <div class="kundli-box" id="d9ChartBox"></div>
            </div>
        </div>

        <h3 style="font-size: 1rem; color: var(--accent-gold); margin-top: 1.5rem; margin-bottom: 0.5rem;">Planetary Positions & Longitudes</h3>
        <div style="overflow-x: auto;">
            <table class="astro-table" id="planetaryTable">
                <thead>
                    <tr>
                        <th>Planet</th>
                        <th>Degree</th>
                        <th>Rashi (Sign)</th>
                        <th>Nakshatra</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const RASHI_NAMES = [
    "Aries (Mesha)", "Taurus (Vrishabha)", "Gemini (Mithuna)", "Cancer (Karka)", 
    "Leo (Simha)", "Virgo (Kanya)", "Libra (Tula)", "Scorpio (Vrishchika)", 
    "Sagittarius (Dhanu)", "Capricorn (Makara)", "Aquarius (Kumbha)", "Pisces (Meena)"
];

const NAKSHATRA_NAMES = [
    "Ashwini", "Bharani", "Krittika", "Rohini", "Mrigashira", "Ardra", "Punarvasu", 
    "Pushya", "Ashlesha", "Magha", "Purva Phalguni", "Uttara Phalguni", "Hasta", 
    "Chitra", "Swati", "Vishakha", "Anuradha", "Jyeshtha", "Moola", "Purva Ashadha", 
    "Uttara Ashadha", "Shravana", "Dhanishta", "Shatabhisha", "Purva Bhadrapada", 
    "Uttara Bhadrapada", "Revati"
];

function getNavamshaLongitude(long) {
    let sign = Math.floor(long / 30);
    let degInSign = long % 30;
    let navIndex = Math.floor(degInSign / (30 / 9));
    let startSign = 0;
    if ([0, 4, 8].includes(sign)) startSign = 0;
    else if ([1, 5, 9].includes(sign)) startSign = 9;
    else if ([2, 6, 10].includes(sign)) startSign = 6;
    else if ([3, 7, 11].includes(sign)) startSign = 3;
    
    let navSign = (startSign + navIndex) % 12;
    return navSign * 30 + 15;
}

function renderNorthIndianChart(containerId, lagnaLong, planets) {
    const container = document.getElementById(containerId);
    if (!container) return;

    let lagnaSignNum = Math.floor(lagnaLong / 30) + 1;

    const houseCoords = [
        { house: 1,  signPos: [150, 45],  textPos: [150, 85] },
        { house: 2,  signPos: [75, 25],   textPos: [75, 50] },
        { house: 3,  signPos: [25, 55],   textPos: [25, 85] },
        { house: 4,  signPos: [75, 120],  textPos: [75, 160] },
        { house: 5,  signPos: [25, 205],  textPos: [25, 235] },
        { house: 6,  signPos: [75, 250],  textPos: [75, 275] },
        { house: 7,  signPos: [150, 195], textPos: [150, 235] },
        { house: 8,  signPos: [225, 250], textPos: [225, 275] },
        { house: 9,  signPos: [275, 205], textPos: [275, 235] },
        { house: 10, signPos: [225, 120], textPos: [225, 160] },
        { house: 11, signPos: [275, 55],  textPos: [275, 85] },
        { house: 12, signPos: [225, 25],  textPos: [225, 50] }
    ];

    let housePlanets = Array.from({ length: 13 }, () => []);
    planets.forEach(p => {
        let pSignNum = Math.floor(p.long / 30) + 1;
        let houseNum = ((pSignNum - lagnaSignNum + 12) % 12) + 1;
        housePlanets[houseNum].push(p.short);
    });

    let svgHTML = `<svg class="chart-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="300" height="300" fill="none" stroke="#fbbf24" stroke-width="2"/>
        <line x1="0" y1="0" x2="300" y2="300" stroke="#fbbf24" stroke-width="1.5"/>
        <line x1="300" y1="0" x2="0" y2="300" stroke="#fbbf24" stroke-width="1.5"/>
        <polygon points="150,0 0,150 150,300 300,150" fill="none" stroke="#fbbf24" stroke-width="1.5"/>`;

    houseCoords.forEach(h => {
        let signForHouse = ((lagnaSignNum - 1 + (h.house - 1)) % 12) + 1;
        let plist = housePlanets[h.house].join(" ");

        svgHTML += `
            <text x="${h.signPos[0]}" y="${h.signPos[1]}" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">${signForHouse}</text>
            <text x="${h.textPos[0]}" y="${h.textPos[1]}" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">${plist}</text>
        `;
    });

    svgHTML += `</svg>`;
    container.innerHTML = svgHTML;
}

function processHoroscope(e) {
    if (e) e.preventDefault();

    const dob = document.getElementById('dob').value;
    const tob = document.getElementById('tob').value;
    const tzHours = parseFloat(document.getElementById('tzHours').value);
    const lat = parseFloat(document.getElementById('bLat').value);
    const lon = parseFloat(document.getElementById('bLon').value);

    const [year, month, day] = dob.split('-').map(Number);
    const [hour, minute, second] = (tob + ':00').split(':').map(Number);

    // Convert local time to UTC decimal hour
    let utcHour = hour + (minute / 60.0) + (second / 3600.0) - tzHours;

    // Set Lahiri Ayanamsha (SE_SIDM_LAHIRI = 1) in Swiss Ephemeris
    swisseph.swe_set_sid_mode(1, 0, 0);

    // Calculate Julian Day in UT
    const julday = swisseph.swe_julday(year, month, day, utcHour, swisseph.SE_GREG_CAL);

    // Calculate Sidereal Houses & Ascendant (Lagna)
    const houses = swisseph.swe_houses_ex(julday, swisseph.SEFLG_SIDEREAL, lat, lon, 'P');
    const lagnaLong = houses.ascendant;

    // Body IDs: Sun(0), Moon(1), Mercury(2), Venus(3), Mars(4), Jupiter(5), Saturn(6), Mean Rahu(10)
    const planetMap = [
        { id: 0, name: "Sun", short: "Su" },
        { id: 1, name: "Moon", short: "Mo" },
        { id: 2, name: "Mercury", short: "Me" },
        { id: 3, name: "Venus", short: "Ve" },
        { id: 4, name: "Mars", short: "Ma" },
        { id: 5, name: "Jupiter", short: "Ju" },
        { id: 6, name: "Saturn", short: "Sa" },
        { id: 10, name: "Rahu", short: "Ra" }
    ];

    let planetsD1 = [];
    const flags = swisseph.SEFLG_SIDEREAL | swisseph.SEFLG_SPEED;

    planetMap.forEach(p => {
        const res = swisseph.swe_calc_ut(julday, p.id, flags);
        let long = res.longitude;
        if (long < 0) long += 360;
        planetsD1.push({ name: p.name, short: p.short, long: long });
    });

    // Compute Ketu exactly 180 degrees opposite Rahu
    let rahuObj = planetsD1.find(p => p.name === "Rahu");
    let ketuLong = (rahuObj.long + 180) % 360;
    planetsD1.push({ name: "Ketu", short: "Ke", long: ketuLong });

    let lagnaD9Long = getNavamshaLongitude(lagnaLong);
    let planetsD9 = planetsD1.map(item => ({ ...item, long: getNavamshaLongitude(item.long) }));

    renderNorthIndianChart('d1ChartBox', lagnaLong, planetsD1);
    renderNorthIndianChart('d9ChartBox', lagnaD9Long, planetsD9);

    const tbody = document.querySelector('#planetaryTable tbody');
    tbody.innerHTML = '';
    
    let lagnaSign = Math.floor(lagnaLong / 30);
    let lagnaDeg = (lagnaLong % 30).toFixed(2);
    tbody.innerHTML += `<tr>
        <td><strong>Lagna (Ascendant)</strong></td>
        <td>${lagnaDeg}°</td>
        <td>${RASHI_NAMES[lagnaSign]}</td>
        <td>${NAKSHATRA_NAMES[Math.floor(lagnaLong / (360/27))]}</td>
    </tr>`;

    planetsD1.forEach(item => {
        let sign = Math.floor(item.long / 30);
        let deg = (item.long % 30).toFixed(2);
        let nakshatraIdx = Math.floor(item.long / (360/27));

        tbody.innerHTML += `<tr>
            <td>${item.name}</td>
            <td>${deg}°</td>
            <td>${RASHI_NAMES[sign]}</td>
            <td>${NAKSHATRA_NAMES[nakshatraIdx]}</td>
        </tr>`;
    });

    document.getElementById('resultsCard').style.display = 'block';
}

document.getElementById('horoscopeForm').addEventListener('submit', processHoroscope);
</script>
</body>
</html>
